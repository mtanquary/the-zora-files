<!--
  Supabase → Authentication → Email Templates → "Reset Password".
  Paste the HTML below into the template body.

  The link uses the token-hash form (cross-device safe) and points at our
  /auth/confirm route, which calls verifyOtp with type=recovery and then sends
  the member to /account/password to set a new password.
-->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#0f141b;padding:32px 0;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="440" cellpadding="0" cellspacing="0" style="background:#161c26;border:1px solid #242b36;border-radius:10px;overflow:hidden;">
        <tr>
          <td style="padding:32px 36px 8px;text-align:center;">
            <div style="color:#F0A500;font-size:20px;letter-spacing:1px;">the zora files</div>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 36px 0;text-align:center;">
            <h1 style="color:#e6edf3;font-size:18px;font-weight:600;margin:16px 0 8px;">reset your password</h1>
            <p style="color:#8b949e;font-size:14px;line-height:1.6;margin:0 0 24px;">
              We got a request to reset your password. Click below to choose a new one. This link expires shortly.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 36px 8px;text-align:center;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/account/password"
               style="display:inline-block;background:#F0A500;color:#0f141b;text-decoration:none;font-weight:600;font-size:14px;padding:12px 28px;border-radius:8px;">
              set a new password
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 36px 32px;text-align:center;">
            <p style="color:#586069;font-size:12px;line-height:1.6;margin:0;">
              Didn't request this? You can safely ignore this email — your password won't change.
            </p>
          </td>
        </tr>
      </table>
      <p style="color:#3d4450;font-size:11px;margin:20px 0 0;">the zora files · finding zora</p>
    </td>
  </tr>
</table>
